
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Quiz de Carreira | Prisma Cursos</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="quiz.css">
</head>

<body>

  <header class="site-header d-none d-md-block">
    <div class="container-fluid px-4 px-lg-5">
      <div class="header-inner d-flex align-items-center justify-content-between">

        <a href="index.html" class="navbar-brand" aria-label="Página inicial">
          <img src="assets/logo_prisma.png" alt="Prisma Cursos" class="logo-img">
        </a>

        <nav class="d-flex align-items-center gap-4 gap-lg-5">
          <a href="index.html" class="nav-item-link">Início</a>
          <a href="quem-somos.html" class="nav-item-link">Quem somos</a>
          <a href="cursos.html" class="nav-item-link">Cursos</a>
          <a href="contatos.html" class="nav-item-link">Contatos</a>
        </nav>

        <a href="quiz.html" class="gift-link" aria-label="Quiz Prisma Cursos">
          <img src="assets/gift_icon.png" alt="" class="gift-icon">
        </a>

      </div>
    </div>
  </header>

  <header class="mobile-header d-md-none">
    <div class="mobile-header-inner d-flex align-items-center justify-content-between px-3">

      <button
        class="mobile-hamburger-btn border-0 bg-transparent p-0"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#mobileMenuDrawer"
        aria-controls="mobileMenuDrawer"
        aria-expanded="false"
        aria-label="Abrir menu"
      >
        <img src="assets/menu_icon.png" alt="" class="mobile-menu-img">
      </button>

      <a href="index.html" class="mobile-header-logo">
        <img src="assets/logo_prisma.png" alt="Prisma Cursos" class="mobile-logo-img">
      </a>

    </div>

    <nav class="collapse mobile-menu-collapse" id="mobileMenuDrawer">
      <div class="d-flex flex-column gap-3 p-3">
        <a href="index.html" class="nav-item-link">Início</a>
        <a href="quem-somos.html" class="nav-item-link">Quem somos</a>
        <a href="cursos.html" class="nav-item-link">Cursos</a>
        <a href="contatos.html" class="nav-item-link">Contatos</a>
        <a href="quiz.html" class="nav-item-link">Quiz</a>
      </div>
    </nav>
  </header>

  <main class="container py-5">

    <section class="quiz-container" aria-labelledby="quiz-title">

      <div class="quiz-intro" id="quiz-intro">
        <h1 id="quiz-title">Descubra o curso ideal para você!</h1>

        <p>
          Responda algumas perguntas sobre seus interesses
          e descubra qual curso da Prisma combina mais com seu perfil.
        </p>

        <button type="button" id="start-btn">
          Começar quiz
        </button>
      </div>

      <div class="quiz-questions" id="quiz-questions" hidden>
        <p id="quiz-progress" aria-live="polite"></p>

        <h2 id="question-title"></h2>

        <div id="answer-options"></div>

        <button type="button" id="next-btn" disabled>
          Próxima pergunta
        </button>
      </div>

      <div class="quiz-result" id="quiz-result" hidden>
        <h2>Seu curso recomendado é:</h2>

        <h3 id="recommended-course"></h3>

        <p id="recommendation-description"></p>

        <a href="cursos.html">
          Conhecer os cursos
        </a>

        <button type="button" id="restart-btn">
          Refazer quiz
        </button>
      </div>

    </section>

  </main>

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
  ></script>

  <script src="quiz.js"></script>

</body>
</html>
