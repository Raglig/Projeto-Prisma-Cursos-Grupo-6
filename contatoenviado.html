  <header class="site-header d-none d-md-block">
    <div class="container-fluid px-4 px-lg-5">
      <div class="header-inner d-flex align-items-center justify-content-between">

        <a href="index.html" class="navbar-brand d-flex align-items-center me-3" id="header-logo">

        </nav>

        <div class="d-flex align-items-center">

        </div>

      </div>
    </div>
  </header>
  <!-- cabeçalho final -->

  <!-- cabeçalho inicio mobile -->
  <header class="mobile-header d-md-none">
    <div class="mobile-header-inner d-flex align-items-center justify-content-between px-3">
      <button class="mobile-hamburger-btn border-0 bg-transparent p-0" type="button" data-bs-toggle="collapse"
        data-bs-target="#mobileMenuDrawer" aria-controls="mobileMenuDrawer" aria-expanded="false"
        aria-label="Toggle navigation" id="mobile-hamburger">
        <img src="assets/menu_icon.png" alt="Menu" class="mobile-menu-img">
      </button>

      <a href="index.html" class="mobile-header-logo">
        <img src="assets/logo_prisma.png" alt="Prisma Cursos" class="mobile-logo-img">
      </a>
    </div>

    <div class="collapse mobile-menu-collapse" id="mobileMenuDrawer">

      </div>
    </div>

  <!-- cabeçalho final mobile -->

  <main>
    <section class="enviado-section">
      <div class="container-fluid enviado-container">
        <div class="row g-0 align-items-start">

          <div class="col-12 col-lg-6">
            <div class="enviado-painel" aria-label="Resumo da mensagem enviada">
              <div class="enviado-pill" id="dado-nome"></div>
              <hr class="enviado-divisor enviado-divisor-1">
              <div class="enviado-pill" id="dado-email"></div>
              <hr class="enviado-divisor enviado-divisor-2">
              <div class="enviado-msg" id="dado-mensagem"></div>
            </div>
          </div>

          <div class="col-12 col-lg-6 enviado-texto-col">
            <h1 class="enviado-titulo">Mensagem enviada<br>com sucesso!</h1>
            <p class="enviado-texto">Agradecemos a mensagem! Em breve um de nossos consultores entrará em contato</p>

          </div>

        </div>
      </div>
    </section>

          <div class="contact-line">✉️ contato@prisma.com</div>

        </div>

          <a href="https://whatsapp.com" target="_blank" rel="noopener noreferrer" class="social-link" title="WhatsApp"
            aria-label="WhatsApp">
            <img src="assets/icon_whatsapp.png" alt="WhatsApp" class="social-icon">
          </a>
          <a href="https://instagram.com" target="_blank" rel="noopener noreferrer" class="social-link"

          <a href="https://youtube.com" target="_blank" rel="noopener noreferrer" class="social-link" title="YouTube"

            <img src="assets/icon_youtube.png" alt="YouTube" class="social-icon social-icon-yt">
          </a>
        </div>

      </div>
    </div>

      <div class="d-flex align-items-center justify-content-between">

        <a href="index.html" class="mobile-footer-logo-link">
          <img src="assets/logo_prisma_icon.png" alt="Prisma Cursos" class="mobile-footer-logo-img">
